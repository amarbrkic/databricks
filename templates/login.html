{% extends "base.html" %}

{% block title %}Login - Open Source Databricks{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-box">
        <h1>Welcome to OpenBricks</h1>
        <p class="subtitle">Open Source Databricks Alternative</p>
        
        <form id="loginForm" method="POST">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required autofocus>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            
            <button type="submit" class="btn btn-primary btn-block">Login</button>
        </form>
        
        <div class="auth-footer">
            <p>Don't have an account? <a href="{{ url_for('register') }}">Register</a></p>
            <p class="demo-info">Demo: username: <code>demo</code>, password: <code>demo</code></p>
        </div>
    </div>
</div>
{% endblock %}
